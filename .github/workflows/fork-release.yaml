name: Fork prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag, e.g. local-v6.13.0-test.1"
        required: true
        type: string
  push:
    tags:
      - local-v*

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate and test
    if: github.repository != 'integrations/terraform-provider-github'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^local-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag must use local-vMAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 1
          fi
          source_sha=$(git rev-parse HEAD)
          if tag_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
            if [[ "$tag_sha" != "$source_sha" ]]; then
              echo "::error::The release tag already points to a different commit. Choose a new tag."
              exit 1
            fi
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#local-v}"
            echo "sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set-up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set-up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package provider
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          binary="terraform-provider-github_v${VERSION}"
          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi
          archive="terraform-provider-github_${VERSION}_${GOOS}_${GOARCH}.zip"
          package_dir="$RUNNER_TEMP/provider-${GOOS}-${GOARCH}"
          dist_dir="$GITHUB_WORKSPACE/dist"
          mkdir -p "$package_dir" "$dist_dir"
          go build -trimpath \
            -ldflags="-s -w -X main.version=$VERSION -X main.commit=$SOURCE_SHA" \
            -o "$package_dir/$binary" .
          zip -j "$dist_dir/$archive" "$package_dir/$binary"

      - name: Upload platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish unsigned prerelease
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: provider-*
          path: dist
          merge-multiple: true

      - name: Verify archives and create checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.zip)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            echo "::error::Expected six platform archives; refusing to publish an incomplete release."
            exit 1
          fi
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              archive="dist/terraform-provider-github_${VERSION}_${goos}_${goarch}.zip"
              binary="terraform-provider-github_v${VERSION}"
              if [[ "$goos" == "windows" ]]; then
                binary="${binary}.exe"
              fi
              unzip -t "$archive"
              if [[ "$(unzip -Z1 "$archive")" != "$binary" ]]; then
                echo "::error::Archive must contain exactly the expected provider executable."
                exit 1
              fi
            done
          done
          cd dist
          sha256sum -- *.zip > "terraform-provider-github_${VERSION}_SHA256SUMS"
          sha256sum --check "terraform-provider-github_${VERSION}_SHA256SUMS"

      - name: Create draft release and upload assets
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/*.zip "dist/terraform-provider-github_${VERSION}_SHA256SUMS" \
            --target "$SOURCE_SHA" \
            --title "Local GitHub provider $VERSION" \
            --notes "Unsigned fork build from commit $SOURCE_SHA. Contains Linux, macOS, and Windows binaries for amd64 and arm64, with SHA-256 checksums. For development overrides or manual installation only; this is not a signed Terraform Registry release." \
            --draft \
            --prerelease

      - name: Publish completed release
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
          printf 'Published prerelease: https://github.com/%s/releases/tag/%s\n' \
            "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
